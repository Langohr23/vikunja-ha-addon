name: "IMAP/SMTP Email MCP Server"
version: "1.0.1"
slug: "email_mcp"
description: "Multi-account IMAP/SMTP MCP server (read, search, send, reply) exposed over Streamable HTTP."
url: "https://github.com/codefuturist/email-mcp"
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:email-multiple"
arch:
  - aarch64
  - amd64
ports:
  8081/tcp: 8081
options:
  config_toml: ""
  enable_web_terminal: true
  env_vars: []
schema:
  config_toml: str?
  enable_web_terminal: bool
  env_vars:
    - name: str
      value: str
