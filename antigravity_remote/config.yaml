name: "Antigravity Remote"
version: "1.0.6"
slug: "antigravity_remote"
description: "Run Google Antigravity CLI (agy) with Remote Control to expose local-network MCP servers via Gemini Remote."
url: "https://antigravity.google"
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:console"
arch:
  - aarch64
  - amd64
map:
  - config:rw
options:
  instance_name: "Home Assistant"
  api_key: ""
  workspace_dir: "/data/workspace"
  enable_web_terminal: true
  mcp_servers: []
  mcp_config_json: ""
  env_vars: []
schema:
  instance_name: str
  api_key: password?
  workspace_dir: str
  enable_web_terminal: bool
  mcp_servers:
    - name: str
      server_url: str?
      auth_header: password?
      command: str?
      args: str?
  mcp_config_json: str?
  env_vars:
    - name: str
      value: str
